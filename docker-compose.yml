version: "3.9"

services:
  db:
    image: postgres:16  # Imagem oficial do PostgreSQL
    container_name: nest_crud_pg
    restart: unless-stopped
    environment:
      POSTGRES_DB: nest_crud        # Nome do banco de dados
      POSTGRES_USER: nest           # Usuário do banco
      POSTGRES_PASSWORD: nest       # Senha do usuário
    ports:
      - "3306:5432"                 # Porta para acesso ao PostgreSQL
    volumes:
      - pgdata_data:/var/lib/postgresql/data  # Volume persistente

volumes:
  pgdata_data: # Volume para armazenar dados do PostgreSQL
